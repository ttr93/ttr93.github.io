<main class="container-fluid my-4 px-2 px-md-4">

                    id="equipeIframe">
            </iframe>
        </div>
    </div>

<!-- Script optionnel pour ajuster automatiquement la hauteur de l'iframe selon le contenu -->
<script>
    window.addEventListener('DOMContentLoaded', () => {
        const iframe = document.getElementById('equipeIframe');
        iframe.addEventListener('load', function() {
            try {
                const height = iframe.contentWindow.document.body.scrollHeight;
                iframe.style.height = (height + 30) + 'px';
            } catch (e) {
                // Fallback si le navigateur bloque l'accès direct (ex: protocole file:// strict)
                iframe.style.height = '1200px';
            }
        });
    });
</script>
